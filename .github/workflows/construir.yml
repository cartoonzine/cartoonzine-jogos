name: Construir e publicar os jogos

on:
  push:
    branches: [main]
    paths-ignore: ['nucleos/**', '.github/workflows/nucleos.yml', 'paginas/**', '.github/workflows/paginas.yml', '.github/workflows/vendor-jsdos8.yml']
  workflow_dispatch:

# só leitura por padrão: os jobs que compilam código de terceiros não podem escrever no repositório.
# Só o job "publicar" (que não roda código dos jogos) ganha permissão de escrita.
permissions:
  contents: read

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      jogos: ${{ steps.l.outputs.jogos }}
    steps:
      - uses: actions/checkout@v4
      - id: l
        run: |
          echo "jogos=$(jq -c '[.jogos[] | select(.rascunho != true) | {id, emsdk: (.emsdk // (if .id == "neverball" then "3.1.65" else "3.1.74" end)), dados: ((.ajustes.dados // []) | map(split("@")[1] // .) | join(","))}]' jogos.json)" >> "$GITHUB_OUTPUT"

  jogo:
    needs: lista
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.lista.outputs.jogos) }}
    name: jogo (${{ matrix.id }})
    permissions:
      contents: read
    container:
      image: emscripten/emsdk:${{ matrix.emsdk }}
      env:
        GL4ES_COMMIT: "c9895df34cd466c23bc60c2bd3db3d87e98fcbe7"
        GL4ES_DIR: "/opt/gl4es"
        DEBIAN_FRONTEND: "noninteractive"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ferramentas
        run: |
          (command -v sudo >/dev/null || (apt-get update -q && apt-get install -y -q sudo))
          sudo apt-get update -q && sudo apt-get install -y -q autoconf automake libtool unzip curl gcc make pkg-config git
      - name: Compilar ${{ matrix.id }}
        run: |
          export RAIZ="$GITHUB_WORKSPACE" SAIDA="$GITHUB_WORKSPACE/saida/${{ matrix.id }}"
          mkdir -p "$SAIDA" && mkdir -p /tmp/obra && cd /tmp/obra
          bash -c ". '$RAIZ/receitas/${{ matrix.id }}.sh'"
          du -sh "$SAIDA" && ls -la "$SAIDA"
      - name: Conferir os artefatos (não basta ter index.html)
        run: node modelo/verificar-saida.mjs "saida/${{ matrix.id }}" --dados "${{ matrix.dados }}" --github
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-${{ matrix.id }}
          path: saida/${{ matrix.id }}
          retention-days: 3

  publicar:
    # o site pronto vai para o branch gh-pages (Settings → Pages → Deploy from a branch → gh-pages / root).
    # Jogo que falhou nesta rodada continua com a versão anterior que já está lá.
    needs: jogo
    if: ${{ always() && !cancelled() }}
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: jogo-*
          path: artefatos
      - name: Montar o site no branch gh-pages
        run: |
          git config user.name "cartoonzine-jogos[bot]"
          git config user.email "cartoonzine-jogos@users.noreply.github.com"
          if git fetch -q --depth 1 origin gh-pages; then git worktree add -q site origin/gh-pages && (cd site && git checkout -q -B gh-pages);
          else git worktree add -q --orphan -b gh-pages site; fi
          for d in artefatos/jogo-*; do
            [ -d "$d" ] || continue
            id="${d#artefatos/jogo-}"; rm -rf "site/$id"; cp -r "$d" "site/$id"
          done
          rm -rf site/capas && cp -r capas site/capas   # capas e banners para o Cartoonzine Studio
          python3 modelo/indice.py jogos.json site
          touch site/.nojekyll
          du -sh site/* || true
          cd site && git add -A && (git diff --cached --quiet && echo "nada mudou" || (git commit -q -m "site: jogos compilados de ${GITHUB_SHA::7}" && git push -q origin gh-pages))
