<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTyrian · Cartoonzine</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #canvas { position: absolute; inset: 0; margin: auto; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; display: block; outline: none; background: #000; }
  #carregando { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    color: #22d3ee; font: 700 14px monospace; letter-spacing: .12em; text-transform: uppercase; pointer-events: none; transition: opacity .4s; }
  #barra { width: min(320px, 60vw); height: 4px; background: #0f172a; border-radius: 4px; overflow: hidden; }
  #barra i { display: block; height: 100%; width: 0; background: #22d3ee; transition: width .2s; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
<div id="carregando"><span id="msg">Carregando OpenTyrian…</span><div id="barra"><i></i></div></div>
<script>
  var Module = {
    canvas: document.getElementById('canvas'),
    print: function () {}, printErr: function () {},
    setStatus: function (t) {
      var m = /\((\d+(?:\.\d+)?)\/(\d+)\)/.exec(t || '');
      if (m) document.querySelector('#barra i').style.width = (100 * m[1] / m[2]) + '%';
      if (!t) { var c = document.getElementById('carregando'); c.style.opacity = '0'; setTimeout(function () { c.remove(); }, 500); }
    },
    monitorRunDependencies: function () {}
  };
  // clique/tecla dentro do jogo: foco no canvas (o teclado e o som do navegador só começam com uma interação)
  ['pointerdown', 'keydown'].forEach(function (e) { window.addEventListener(e, function () { if (document.activeElement !== Module.canvas) Module.canvas.focus(); }, true); });
  window.addEventListener('load', function () { Module.canvas.focus(); });
</script>
<script async src="index.js"></script>
</body>
</html>
